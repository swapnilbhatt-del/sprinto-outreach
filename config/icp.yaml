# Sprinto ICP and qualification rubric.
#
# Decision rule (enforced in src/qualify.py):
#   1. Every gate resolves to pass | fail | unknown from validated facts (facts without a
#      supporting quote are dropped before they get here).
#   2. Any `fail` short-circuits: status = no_go, research stops for that company.
#   3. No fail but any `unknown` when the agent loop exits: status = needs_review.
#   4. Every gate `pass`: status = go.
#   5. Weighted factors are scored only for `go` companies, to rank them. A score can never
#      turn no_go or needs_review into go.
#
# Decisions taken on 2026-11-04 (see `decisions` at the bottom for the reasoning).

version: 2
status: confirmed

# The company you represent. The web app (src/webapp.py) matches the name typed into it against
# `name` and `aliases`; other sellers are not set up yet.
seller:
  name: Sprinto
  domain: sprinto.com
  aliases: [sprinto, sprinto.com, sprinto.io]
  pitch: Compliance automation that gets B2B software companies SOC 2 and ISO 27001 audit-ready.
  discovery:
    # Free Bing News searches for recent funding rounds. Funded B2B software companies are where
    # G1 (software) and G2 (Series A-C) are most likely to pass; the pipeline checks the rest.
    queries:
      - 'SaaS startup raises "Series A"'
      - 'SaaS startup raises "Series B"'
      - 'B2B software raises "Series C"'
      - 'Indian SaaS startup raises Series funding'
      - 'fintech platform raises "Series B"'
      - 'AI startup raises "Series A" enterprise customers'
    items_per_query: 10
    max_candidates: 25

run:
  max_companies_per_run: 10
  shortlist_exclusions:
    - path: data/hubspot_customers.csv
      domain_column: Company Domain Name     # HubSpot company-export column
      stage_column: Lifecycle Stage          # only these stages are excluded; leads stay researchable
      exclude_stages: [customer, evangelist]
      required: true
    - path: data/competitor_customers.csv
      domain_column: domain
      required: false

llm:
  provider: gemini                 # gemini | anthropic
  # Tried in order. 503 / dropped connection -> next model; a daily-quota 429 skips that model for the
  # rest of the run. Pro models aren't on this key's free plan; 2.5 models are closed to new users.
  gemini_models: [gemini-3.8-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-flash-lite-latest]
  rate_limit_wait_seconds: 20      # per-minute 429: wait this long (or Google's retryDelay, max 60 s) once
  min_interval_seconds: 5          # free tier allows ~10-15 requests/minute
  request_timeout_seconds: 90      # a hung Gemini request gives up and the next model is tried
  model: claude-opus-5-5           # used when provider is anthropic
  effort: { extract: low, planner: low, draft: medium }
  use_refusal_fallback: true                 # server-side fallback on a policy decline

agent_loop:
  max_passes: 3                    # pass 1 = all free sources; passes 2-3 = planner-chosen
  max_pages_per_company: 8         # fetches of the company's own site (incl. 404s)
  max_free_api_calls_per_company: 16   # name lookup 1, news 9, job boards 3, Wikidata 2
  max_llm_calls_per_company: 12    # extract + planner + draft
  llm_calls_reserved_for_draft: 1  # the loop stops early so the draft call is never starved
  max_actions_per_pass: 3          # how many whitelist actions the planner may pick per pass
  max_candidate_urls_per_action: 2 # e.g. /trust then /trust-center; 1 once the homepage was read and doesn't link the page
  http_timeout_seconds: 15
  max_clean_text_chars: 12000
  min_page_text_chars: 200         # less than this (e.g. a JavaScript-only trust center) = empty_page, not checked
  vendor_after_gates_pass: [G1, G5] # paid vendor lookups (Hunter credits) wait until these gates pass
  news_items_per_query: 8
  news_min_interval_seconds: 2     # polite gap between Bing news calls, shared across companies
  user_agent: "SprintoOutreachResearchBot/0.2 (B2B research; respects robots.txt)"

# ---------------------------------------------------------------------------
# GATES. `order` is the order they are reported and targeted in.
# `fact_keys` are the extract.py schema fields that can settle the gate.
# `sources.free` must be exhausted before `sources.scrape` is allowed (per gate).
# ---------------------------------------------------------------------------
gate_order: [G1, G5, G3, G2, G4]

gates:

  G1:
    name: SaaS business (sells software to businesses)
    facts_that_settle_it:
      - Company sells internet-delivered software (cloud / SaaS / platform / API)
      - Buyers are businesses (team or enterprise plans, "book a demo", B2B customer logos or case studies)
    fact_keys: [is_software_product, sells_to_businesses]
    sources:
      free: []                     # no free source states this reliably; homepage is the primary source
      scrape: [scrape_homepage, scrape_about]
    sufficient_answer:
      pass: Quote showing a software product AND quote showing business buyers
      fail: Quote showing the company is not a software product, or sells only to consumers
    max_passes: 2
    if_unanswered: needs_review

  G2:
    name: Funding stage Series A to C
    facts_that_settle_it:
      - Most recent priced equity round named in a press release or news article, with its date
    fact_keys: [funding_round]
    sources:
      free: [news:g2_raises, news:g2_funding, news:g2_series, news:g2_acquired, scrape_press_page]
      scrape: [scrape_about]
    news_queries:
      g2_raises: '"{company}" raises'
      g2_funding: '"{company}" funding round'
      g2_series: '{company} series round'   # unquoted: Bing News finds older round coverage this way
      g2_acquired: '"{company}" acquired'   # catches an acquisition newer than the last round
    pass_rounds: [series_a, series_b, series_c]
    fail_rounds: [series_d_plus, public, acquired]
    sufficient_answer:
      pass: Dated article or press release naming a Series A, B or C round within freshness_months
      fail: Latest dated round is Series D or later, IPO or acquisition; or seed is the latest round and is under 18 months old
    freshness_months: 36
    seed_fail_within_months: 18
    max_passes: 2
    if_unanswered: needs_review

  G3:
    name: Employee count 100 to 1000
    facts_that_settle_it:
      - A stated headcount number or range (company page, press article, Wikidata P1128, or Hunter's company size bucket)
    fact_keys: [employee_count]
    sources:
      free: [wikidata_lookup, news:g3_employees, scrape_press_page]
      vendor: [hunter_company_lookup]      # Hunter size bucket, 0.2 credit, cached; can pass G3, never fails it alone
      scrape: [scrape_about, scrape_careers]
    news_queries:
      g3_employees: '"{company}" employees'
    min: 100
    max: 1000
    sufficient_answer:
      pass: Most recent number or range lies entirely inside [100, 1000]
      fail: Entirely below 100 (hard short-circuit) or entirely above 1000
      straddling_range: unknown
    freshness_months: 24
    max_passes: 2
    if_unanswered: needs_review

  G4:
    name: Compliance pressure (at least one of a, b, c)
    scoring_only: true             # adds `weight` points when met; never rejects a company (decision G4-scoring)
    weight: 3
    facts_that_settle_it:
      - (a) An open compliance / GRC / security role
      - (b) Trust or security page says SOC 2 / ISO 27001 is in progress, planned, or customer-requested
      - (c) A new security or compliance leader announced in the last 12 months
    any_of:
      a_job_posting:
        fact: Open role in compliance, GRC, security or IT audit
        fact_keys: [compliance_job_titles]
        title_keywords: [compliance, grc, governance, risk and compliance, security engineer, information security, infosec, security analyst, it audit, privacy, trust and safety]
        sources: { free: [job_board_lookup], scrape: [scrape_careers] }
      b_trust_page:
        fact: Trust or security page says SOC 2 / ISO 27001 is in progress, planned, or asked for by customers
        fact_keys: [soc2_iso_status]
        qualifying_values: [in_progress_or_planned]
        sources: { free: [], scrape: [scrape_trust, scrape_security] }
      c_leadership_change:
        fact: New CISO / Head of Security / Head of Compliance / VP Security announced
        fact_keys: [security_leader_change]
        window_months: 12
        sources: { free: [news:g4_ciso, news:g4_head], scrape: [] }
    fact_keys: [compliance_job_titles, soc2_iso_status, security_leader_change]
    sources:
      free: [job_board_lookup, news:g4_ciso, news:g4_head, scrape_press_page]
      scrape: [scrape_careers, scrape_trust, scrape_security]
    news_queries:
      g4_ciso: '"{company}" CISO'
      g4_head: '"{company}" "head of security"'
    sufficient_answer:
      pass: Any one of a, b, c with a quote and URL
      fail: Job boards and careers page checked, trust and security pages checked, both news queries run, and none met
    max_passes: 3
    if_unanswered: needs_review

  G5:
    name: No existing public SOC 2 Type II or ISO 27001 attestation
    facts_that_settle_it:
      - No claim of SOC 2 Type II or ISO 27001 achieved on homepage, trust or security pages, or in news
    fact_keys: [soc2_iso_status]
    sources:
      free: [news:g5_soc2, news:g5_iso]
      scrape: [scrape_homepage, scrape_trust, scrape_security]
    news_queries:
      g5_soc2: '"{company}" "SOC 2"'
      g5_iso: '"{company}" "ISO 27001"'
    fail_values: [attested_type2_or_iso]
    sufficient_answer:
      fail: Any quote claiming SOC 2 Type II or ISO 27001 achieved (site, hosted trust center, or news)
      pass: >
        Homepage fetched AND (trust or security page fetched, or every candidate URL tried for
        both returned 404) AND both g5 news queries run, with no attestation found.
      soc2_type1_only: pass        # still needs Type II
    max_passes: 3                  # needs three separate sources: news, homepage, trust/security
    if_unanswered: needs_review

# ---------------------------------------------------------------------------
# WEIGHTED factors: only for `go` companies, ranking only. Unknown scores 0.
# ---------------------------------------------------------------------------
weighted:
  W1: { name: Upmarket sales motion, fact_key: enterprise_motion, weight: 3 }
  W2: { name: Regulated / data-sensitive vertical (fintech, healthtech, HR, PII-heavy), fact_key: regulated_vertical, weight: 3 }
  W3: { name: Funding round in the last 12 months, fact_key: funding_round, within_months: 12, weight: 2 }
  W4: { name: EU / GDPR exposure, fact_key: eu_presence, weight: 1 }
  W5: { name: SOC 2 Type I only (upgrade path), fact_key: soc2_iso_status, value: type1_only, weight: 1 }

# ---------------------------------------------------------------------------
# Action whitelist. The planner returns action ids only; code builds every URL.
# ---------------------------------------------------------------------------
actions:
  wikidata_lookup:   { tier: free, serves: [G3] }
  job_board_lookup:
    tier: free
    serves: [G4]
    url_templates:
      - https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
      - https://api.lever.co/v0/postings/{slug}?mode=json
      - https://api.ashbyhq.com/posting-api/job-board/{slug}
  scrape_press_page: { tier: free, serves: [G2, G3, G4], paths: [/press, /newsroom, /news] }
  hunter_company_lookup: { tier: vendor, serves: [G3] }   # after free sources, before scraping
  scrape_homepage:   { tier: scrape, serves: [G1, G5], paths: [/] }
  scrape_about:      { tier: scrape, serves: [G1, G2, G3], paths: [/about, /about-us, /company] }
  scrape_careers:    { tier: scrape, serves: [G3, G4], paths: [/careers, /jobs] }
  scrape_trust:      { tier: scrape, serves: [G4, G5], paths: [/trust, /trust-center], subdomains: [trust],
                       link_keywords: [iso-27001, iso27001, soc-2, soc2, certificate, trust-center, trust] }
  scrape_security:   { tier: scrape, serves: [G4, G5], paths: [/security, /compliance],
                       link_keywords: [iso-27001, iso27001, soc-2, soc2, certificate, compliance-security, security] }
# news:<query_id> actions are generated from each gate's news_queries (tier free).

# Hosted trust centers a homepage may link to. Only followed when linked from the company's own page.
trust_center_hosts: [trust.vanta.com, app.vanta.com, trust.drata.com, app.safebase.io, trust.secureframe.com, trust.sprinto.com]

# ---------------------------------------------------------------------------
# Point of contact (Step 6)
# ---------------------------------------------------------------------------
contact:
  hunter_monthly_quota: 50          # Free plan: 50 credits per billing cycle (resets on the 5th). Search 1, email finder 1, email check 0.5, company lookup 0. Each run also reads Hunter's live balance and never goes past it.
  # Hunter returns its 10 most confident addresses, whatever the role. Asking for these departments
  # first surfaces security/compliance and technical leaders. If it finds no ranked, verified contact,
  # one unfiltered search follows and the results are merged (only while quota remains; worst case 2 per company). Values per Hunter's API docs.
  hunter_filters: { department: "it,executive,management", required_field: position }
  title_ranking:
    - Chief Information Security Officer
    - Head of Compliance
    - Director of Security
    - Head of Security
    - VP Engineering
    - CTO
    # Fallbacks (decision contact-fallback): before a first SOC 2 there is usually no security
    # leader, and the technical or founding leader owns the audit decision.
    - Head of Engineering
    - Head of IT
    - Co-founder
    - CEO
    - COO
  title_aliases:
    Chief Information Security Officer: [ciso, chief information security officer, chief security officer]
    Head of Compliance: [head of compliance, compliance lead, head of grc]
    Director of Security: [director of security, security director, director of information security, director information security]
    Head of Security: [head of security, head of information security, security lead]
    VP Engineering: [vp engineering, vp of engineering, vice president engineering, vice president of engineering]
    CTO: [cto, chief technology officer]
    Head of Engineering: [head of engineering, director of engineering, engineering director, vp technology, vice president technology, head of technology]
    Head of IT: [head of it, it head, director of it, it director, chief information officer, cio]
    Co-founder: [co founder, cofounder, founder ceo, founder and ceo, founder cto, founder and cto]
    CEO: [ceo, chief executive officer, managing director]
    COO: [coo, chief operating officer]
  # Hunter's verification.status for a deliverable, verified address is `valid`.
  accepted_verification_status: [valid, verified, deliverable]
  # When the best-ranked contacts have no verification status, check up to this many with Hunter's
  # Email Verifier (budgeted at 0.5 credit each, cached per address forever). Only `valid` is accepted.
  verify_unverified_max: 2
  # Still no contact: read the company's leaders from free news coverage (a verbatim quote must name
  # the person and their role), then ask Hunter's Email Finder for up to this many of them (1 credit
  # each, cached). Only a `valid` address is used.
  leader_finder_max: 2
  if_no_match: needs_review

# ---------------------------------------------------------------------------
# Email (Step 7)
# ---------------------------------------------------------------------------
email:
  max_words: 120
  pain_points: 2
  hook_fact_keys: [compliance_job_titles, security_leader_change, funding_round, soc2_iso_status]
  if_no_hook: needs_review
  sprinto_value_props:
    - Automates evidence collection for SOC 2, ISO 27001 and GDPR across cloud, HR and code tools
    - Gets first-time SOC 2 audit-ready in weeks rather than months
    - Answers enterprise security questionnaires from one source of truth
    - Continuous control monitoring so a lean team doesn't need a full GRC hire to stay compliant

decisions:
  - id: contact-fallback
    decision: After the security and engineering titles, the contact list falls back to Head of Engineering, Head of IT, a co-founder, the CEO and the COO.
    why: >
      On 2026-11-10 Fleetx and Wealthy passed every gate but had no CISO, security head, VP
      Engineering or CTO in Hunter's results. A company buying its first SOC 2 usually has no security
      leader yet; the founder or technical head decides. Security titles still win when present.
  - id: G4-scoring
    decision: G4 (compliance pressure) adds 3 points when met instead of being a pass/fail gate. Chosen by the user on 2026-11-10.
    why: >
      In the 2026-11-10 batch, 6 of 9 companies passed or were unresolved on every other gate and
      were rejected only by G4. G4 is a timing signal, and it is hard to observe in the target
      market: Indian and Gulf companies post jobs on LinkedIn, Naukri or JavaScript widgets the
      pipeline can't read, so "no evidence" often meant "couldn't see". G1, G2, G3 and G5 decide
      fit; G4 ranks go companies and supplies the email hook when it is found. It is still
      researched in every run.
  - id: G3-floor
    decision: Kept 100-1000 as briefed.
    why: >
      Third-party data on Sprinto's customer base puts the most common customer size at 11-50
      employees, so a floor of 100 skips Sprinto's core segment. Kept anyway because the brief
      uses headcount as a proxy for compliance pressure and Sprinto is moving up-market
      (SMB to mid-market). Lower `min` to 20 to cover the core segment.
  - id: G2-bootstrapped
    decision: Bootstrapped companies with no priced round end up unknown (needs_review), not fail.
    why: No funding news is absence of evidence. Only a found round outside A-C fails the gate.
  - id: G4b
    decision: Trust page counts only when SOC 2 / ISO is in progress, planned or customer-requested.
    why: A completed attestation fails G5, so it cannot also be compliance-pressure evidence.
  - id: G5-type1
    decision: SOC 2 Type I only passes G5 and adds weight W5.
    why: Type II is the attestation enterprise buyers ask for; Type I companies still need it.
  - id: hunter-status
    decision: Accept only verification.status = valid; reject accept_all and unknown.
    why: The brief asks for verified or deliverable emails only.
  - id: news-source
    decision: News comes from Bing News RSS, not Google News RSS or GDELT.
    why: >
      news.google.com/robots.txt disallows all automated agents, and the hard rules forbid fetching
      what robots.txt disallows. GDELT was tried next, but from this network it rate-limited or timed
      out 45 of 48 requests. Bing's /news/search RSS is allowed by its robots.txt, needs no key,
      returned on-topic, dated results going back years in testing, and carries the publisher URL in
      each link. Bing handles complex OR queries poorly, so each query is a simple phrase. Microsoft's
      terms of use for automated querying were not reviewed.
  - id: llm-provider
    decision: Gemini (gemini-3.8-flash, falling back to gemini-3.1-flash-lite) instead of Claude.
    why: >
      No Anthropic API key was available; a Gemini key was. In a test on 4 Nov 2026, Pro models
      returned 429 (not on this key's plan), 2.5 models returned 404 (closed to new users), and the
      newer Flash models returned 503 (overloaded). flash-lite kept 8 of 9 test facts with exact
      quotes; validate.py dropped the ninth, a quote spliced from two sentences.
  - id: excluded-known-customers
    decision: Rocketlane, Bizongo, Turtlemint and Whatfix are in the stand-in HubSpot file.
    why: Each is publicly named as a Sprinto customer.
