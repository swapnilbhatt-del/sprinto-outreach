# Runs the L6 reply agent every 15 minutes on the live deployment (Vercel's Hobby plan only allows
# daily cron jobs). Needs two repository secrets: APP_URL (https://...vercel.app) and CRON_SECRET.
name: reply-agent tick
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check replies on all active threads
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          curl -sS --fail-with-body -X POST "$APP_URL/api/agent/tick" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}' --max-time 300
